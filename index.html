const STORE_KEY = "uscitizen_app_v1";
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveStore(state) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function checkAnswer(qId, userAnswer, preferredText) {
  const lower = (userAnswer || "").toLowerCase().trim();
  if (!lower) return false;
  const keys = ACTIVE_KEYWORDS[qId] || [];
  const prefWords = preferredText
    ? preferredText.toLowerCase().split(/\s+/).filter(w => w.length > 3)
    : [];
  const allKeys = [...keys, ...prefWords];
  const needed = ACTIVE_MULTI_PART[qId] || 1;
  let matched = 0;
  for (const kw of allKeys) {
    if (lower.includes(kw.toLowerCase())) matched++;
    if (matched >= needed) return true;
  }
  return false;
}

function highlightAnswer(answer, coreWords) {
  if (!coreWords || coreWords.length === 0) return [{ text: answer, hl: false }];
  const sorted = [...coreWords].sort((a, b) => b.length - a.length);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${sorted.map(esc).join('|')})`, 'gi');
  let m; const matches = [];
  while ((m = regex.exec(answer)) !== null) matches.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
  if (matches.length === 0) return [{ text: answer, hl: false }];
  const parts = []; let lastEnd = 0;
  matches.forEach(mm => {
    if (mm.start > lastEnd) parts.push({ text: answer.slice(lastEnd, mm.start), hl: false });
    parts.push({ text: mm.text, hl: true });
    lastEnd = mm.end;
  });
  if (lastEnd < answer.length) parts.push({ text: answer.slice(lastEnd), hl: false });
  return parts;
}

  const digits = (zip || "").replace(/\D/g, "");
  if (digits.length < 3) return null;
  const prefix = parseInt(digits.slice(0, 3), 10);
  for (const [min, max, state] of ZIP3_RANGES) {
    if (prefix >= min && prefix <= max) return state;
  }
  return null;
}

const MULTI_PART_128 = {
  10: 2,
  48: 2,
  65: 3,
  67: 2,
  69: 2,
  81: 5,
  126: 3,
};

const OFFICIAL_IDS_128 = [23, 29, 30, 38, 39, 57, 61, 62];

const STATE_FILL_128 = { senator: 23, governor: 61, capital: 62 };

// Kept in sync from inside App() on every render based on the active test
// version, since checkAnswer() is a plain module-level function and cannot
// see React state directly.
let ACTIVE_KEYWORDS = KEYWORDS100;
let ACTIVE_MULTI_PART = MULTI_PART_100;

function getOptions(q, effAnswer) {
  return shuffle([effAnswer, ...q.wrong]);
}

/* ---------- MAIN APP ---------- */
function App() {
  // Persistent (device-saved) state
  const [xp, setXp] = useState(0);
  const [streak, setStreak] = useState(0);
  const [customQuestions, setCustomQuestions] = useState([]);
  const [testsPassed, setTestsPassed] = useState(0);
  const [testsTaken, setTestsTaken] = useState(0);
  const [myState, setMyState] = useState("");
  const [myZip, setMyZip] = useState("");
  const [hydrated, setHydrated] = useState(false);
  // null = not chosen yet -> shows the version picker before the app loads
  const [testVersion, setTestVersion] = useState(null);

  // Per-version state: question IDs mean different things in each version
  // (e.g. Q23 is "your Representative" in the 2008 set but "your Senator"
  // in the 2025 set), so progress/answers/focus-list must stay separated.
  const [completedLessons100, setCompletedLessons100] = useState({});
  const [completedLessons128, setCompletedLessons128] = useState({});
  const [preferredAnswers100, setPreferredAnswers100] = useState({});
  const [preferredAnswers128, setPreferredAnswers128] = useState({});
  const [practiceList100, setPracticeList100] = useState([]);
  const [practiceList128, setPracticeList128] = useState([]);

  useEffect(() => {
    const s = loadStore();
    if (s) {
      setXp(s.xp || 0);
      setStreak(s.streak || 0);
      setCustomQuestions(s.customQuestions || []);
      setTestsPassed(s.testsPassed || 0);
      setTestsTaken(s.testsTaken || 0);
      setMyState(s.myState || "");
      setMyZip(s.myZip || "");
      setTestVersion(s.testVersion || null);
      // Migrate pre-version-split saves (from before this update) into the "100" slot
      setCompletedLessons100(s.completedLessons100 || s.completedLessons || {});
      setCompletedLessons128(s.completedLessons128 || {});
      setPreferredAnswers100(s.preferredAnswers100 || s.preferredAnswers || {});
      setPreferredAnswers128(s.preferredAnswers128 || {});
      setPracticeList100(s.practiceList100 || s.practiceList || []);
      setPracticeList128(s.practiceList128 || []);
    }
    setHydrated(true);
  }, []);

  useEffect(() => {
    if (!hydrated) return;
    saveStore({
      xp, streak, customQuestions, testsPassed, testsTaken, myState, myZip, testVersion,
      completedLessons100, completedLessons128,
      preferredAnswers100, preferredAnswers128,
      practiceList100, practiceList128,
    });
  }, [hydrated, xp, streak, customQuestions, testsPassed, testsTaken, myState, myZip, testVersion,
      completedLessons100, completedLessons128, preferredAnswers100, preferredAnswers128, practiceList100, practiceList128]);

  // ── Active-version aliases — the rest of the app just uses these names ────
  const allQuestions = testVersion === "128" ? allQuestions128 : allQuestions100;
  const LESSONS = testVersion === "128" ? LESSONS128 : LESSONS100;
  const LEARN = testVersion === "128" ? LEARN128 : LEARN100;
  const ANSWER_OPTIONS = testVersion === "128" ? ANSWER_OPTIONS128 : ANSWER_OPTIONS100;
  const OFFICIAL_IDS = testVersion === "128" ? OFFICIAL_IDS_128 : OFFICIAL_IDS_100;
  const STATE_FILL = testVersion === "128" ? STATE_FILL_128 : STATE_FILL_100;
  const completedLessons = testVersion === "128" ? completedLessons128 : completedLessons100;
  const setCompletedLessons = testVersion === "128" ? setCompletedLessons128 : setCompletedLessons100;
  const preferredAnswers = testVersion === "128" ? preferredAnswers128 : preferredAnswers100;
  const setPreferredAnswers = testVersion === "128" ? setPreferredAnswers128 : setPreferredAnswers100;
  const practiceList = testVersion === "128" ? practiceList128 : practiceList100;
  const setPracticeList = testVersion === "128" ? setPracticeList128 : setPracticeList100;
  // checkAnswer() lives outside this component and cannot see React state,
  // so keep its module-level lookup tables in sync with the active version.
  ACTIVE_KEYWORDS = testVersion === "128" ? KEYWORDS128 : KEYWORDS100;
  ACTIVE_MULTI_PART = testVersion === "128" ? MULTI_PART_128 : MULTI_PART_100;
  const FULL_TEST_SIZE = testVersion === "128" ? 20 : 10;
  const FULL_TEST_PASS = testVersion === "128" ? 12 : 6;

  // Navigation
  const [screen, setScreen] = useState("home");
  const [mode, setMode] = useState("multiple");
  const [currentLesson, setCurrentLesson] = useState(null);
  const [isFullTest, setIsFullTest] = useState(false);

  // Session state
  const [questions, setQuestions] = useState([]);

  const [selected, setSelected] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [correctCount, setCorrectCount] = useState(0);
  const [xpEarned, setXpEarned] = useState(0);
  const [showXpPop, setShowXpPop] = useState(false);
  const [typedAnswer, setTypedAnswer] = useState("");
  const [writingResult, setWritingResult] = useState(null);
  const [testResults, setTestResults] = useState([]);

  // Learn-mode state
  const [learnIndex, setLearnIndex] = useState(0);

  // Manage screen state

  const [pickAnswerDraft, setPickAnswerDraft] = useState("");
  const [pickAddFocus, setPickAddFocus] = useState(true);

  const level = Math.floor(xp / 100) + 1;
  const overallLessonPct = Math.round((Object.keys(completedLessons).length / LESSONS.length) * 100);
  const xpInLevel = xp % 100;

  function effAnswer(q) { return preferredAnswers[q.id] || q.a; }
  function allPool() { return [...allQuestions, ...customQuestions]; }

  function resetSession() {
    setQIndex(0); setHearts(3); setSelected(null); setFeedback(null);
    setCorrectCount(0); setXpEarned(0); setTypedAnswer(""); setWritingResult(null);
    setLearnIndex(0); setLearnRevealed(false); setLearnKnown(new Set()); setLearnDone(false);
    setTestResults([]);
  }

  function startLesson(lesson, m) {
    const pool = lesson.custom
      ? customQuestions
      : lesson.practiceList
      ? allPool().filter(q => practiceList.includes(q.id))
      : lesson.ids.map(id => allQuestions.find(q => q.id === id)).filter(Boolean);
    const qs = shuffle(pool).slice(0, Math.min(pool.length, 8));
    resetSession();
    setCurrentLesson(lesson);
    setIsFullTest(false);
    setQuestions(qs);
    setMode(m);
    setScreen(m === "learn" ? "learn" : "lesson");
  }

  function startFullTest(m) {
    const qs = shuffle(allPool()).slice(0, FULL_TEST_SIZE);
    resetSession();
    setHearts(FULL_TEST_SIZE + 5); // Full Test always runs to completion — no early cutoff from misses
    setIsFullTest(true);
    setCurrentLesson({ title: "Full Practice Test", emoji: "🎯", color: "#C9A227", ids: qs.map(q => q.id) });
    setQuestions(qs);
    setMode(m);
    setScreen(m === "learn" ? "learn" : "lesson");
  }

  function playCorrect() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [[523,0,0.15],[659,0.15,0.15],[784,0.28,0.2]].forEach(([f,s,d]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type = "sine";
        o.frequency.setValueAtTime(f, ctx.currentTime + s);
        g.gain.setValueAtTime(0.25, ctx.currentTime + s);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + s + d);
        o.start(ctx.currentTime + s); o.stop(ctx.currentTime + s + d);
      });
    } catch(e) {}
  }
  function playWrong() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [[300,0,0.15],[220,0.15,0.25]].forEach(([f,s,d]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type = "sawtooth";
        o.frequency.setValueAtTime(f, ctx.currentTime + s);
        g.gain.setValueAtTime(0.15, ctx.currentTime + s);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + s + d);
        o.start(ctx.currentTime + s); o.stop(ctx.currentTime + s + d);
      });
    } catch(e) {}
  }

  function toggleStruggle(qId) {
    setPracticeList(prev => prev.includes(qId) ? prev.filter(id => id !== qId) : [...prev, qId]);
  }

  function handleSelect(option) {
    if (feedback) return;
    setSelected(option);
    const q = questions[qIndex];
    const correctText = effAnswer(q);
    const isCorrect = option === correctText;
    setFeedback(isCorrect ? "correct" : "wrong");
    if (isCorrect) {
      playCorrect();
      setCorrectCount(c => c + 1); setXpEarned(e => e + 10); setXp(x => x + 10);
      setShowXpPop(true); setTimeout(() => setShowXpPop(false), 1000);
      setPracticeList(prev => prev.filter(id => id !== q.id));
    } else {
      playWrong(); setHearts(h => h - 1);
      setPracticeList(prev => prev.includes(q.id) ? prev : [...prev, q.id]);
    }
    setTestResults(prev => [...prev, { q, correct: isCorrect, userAnswer: option }]);
  }

  function handleWritingSubmit() {
    if (!typedAnswer.trim() || writingResult) return;
    const q = questions[qIndex];
    const isCorrect = checkAnswer(q.id, typedAnswer, preferredAnswers[q.id]);
    setWritingResult(isCorrect ? "correct" : "wrong");
    setFeedback(isCorrect ? "correct" : "wrong");
    if (isCorrect) {
      playCorrect();
      setCorrectCount(c => c + 1); setXpEarned(e => e + 15); setXp(x => x + 15);
      setShowXpPop(true); setTimeout(() => setShowXpPop(false), 1000);
      setPracticeList(prev => prev.filter(id => id !== q.id));
    } else {
      playWrong(); setHearts(h => h - 1);
      setPracticeList(prev => prev.includes(q.id) ? prev : [...prev, q.id]);
    }
    setTestResults(prev => [...prev, { q, correct: isCorrect, userAnswer: typedAnswer }]);
  }

  function nextQuestion() {
    const nextIdx = qIndex + 1;
    if (hearts <= 0 || nextIdx >= questions.length) {
      const finalC = correctCount + (feedback === "correct" ? 1 : 0);
      if (isFullTest) {
        setTestsTaken(t => t + 1);
        if (finalC >= FULL_TEST_PASS) { setTestsPassed(p => p + 1); setStreak(s => s + 1); }
        setScreen("testresult");
      } else {
        if (finalC >= Math.ceil(questions.length * 0.6)) {
          setCompletedLessons(prev => ({ ...prev, [currentLesson.id]: true }));
          setStreak(s => s + 1);
        }
        setScreen("result");
      }
    } else {
      setQIndex(nextIdx); setSelected(null); setFeedback(null);
      setTypedAnswer(""); setWritingResult(null);
    }
  }

  function addCustomQuestion() {
    if (!customDraft.q.trim() || !customDraft.a.trim()) return;
    const newId = "c" + Date.now();
    setCustomQuestions(prev => [...prev, {
      id: newId, category: "Custom", emoji: "✏️",
      q: customDraft.q.trim(), a: customDraft.a.trim(),
      wrong: ["Not this one", "Also incorrect", "Try again"], custom: true,
    }]);
    setCustomDraft({ q: "", a: "" });
    setShowCustomForm(false);
  }
  function deleteCustomQuestion(id) {
    setCustomQuestions(prev => prev.filter(q => q.id !== id));
    setPracticeList(prev => prev.filter(pid => pid !== id));
  }
  function savePreferred(qId, text) {
    setPreferredAnswers(prev => {
      const next = { ...prev };
      if (!text || !text.trim()) delete next[qId];
      else next[qId] = text.trim();
      return next;
    });
  }

  function confirmFocusPick() {
    if (!pickFromListQ || !pickAnswerDraft.trim()) return;
    savePreferred(pickFromListQ.id, pickAnswerDraft.trim());
    if (pickAddFocus) {
      setPracticeList(prev => prev.includes(pickFromListQ.id) ? prev : [...prev, pickFromListQ.id]);
    }
    setPickFromListQ(null);
    setPickAnswerDraft("");
    setFocusSearch("");
  }

  function applyMyState(stateName) {
    setMyState(stateName);
    const info = STATE_DATA[stateName];
    if (!info) return;
    setPreferredAnswers(prev => {
      const next = { ...prev };
      if (info.capital) next[STATE_FILL.capital] = info.capital;
      if (info.governor) next[STATE_FILL.governor] = info.governor;
      if (info.senators && info.senators.length) next[STATE_FILL.senator] = info.senators.join(" or ");
      return next;
    });
  }

  const q = questions[qIndex];
  const options = q && mode === "multiple" ? getOptions(q, effAnswer(q)) : [];
  const progress = questions.length > 0 ? (qIndex / questions.length) * 100 : 0;
  const finalCorrect = feedback === "correct" ? correctCount + 1 : correctCount;

  const S = { app: { minHeight: "100vh", background: "#0f1923", fontFamily: "'Inter','Helvetica Neue',sans-serif", color: "#fff", maxWidth: 480, margin: "0 auto", padding: "0 0 40px", position: "relative" } };
  const R = { pill: 999, card: 20, shadow: "0 6px 20px rgba(0,0,0,0.35)", shadowSm: "0 3px 10px rgba(0,0,0,0.3)" };

  /* ============================ VERSION CHOOSER ============================ */
  // Shown once before the app loads (hydrated but no version saved yet).
  if (hydrated && testVersion === null) {
    return (
      <div style={{ ...S.app, display: "flex", flexDirection: "column", justifyContent: "center", minHeight: "100vh", padding: "32px 24px" }}>
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          <img src="mascot-book.png" alt="" style={{ width: 72, height: 72, objectFit: "contain", marginBottom: 14 }} />
          <h1 style={{ fontSize: 22, fontWeight: 900, margin: "0 0 8px" }}>Which test are you studying for?</h1>
          <p style={{ fontSize: 13, color: "#6b7a99", lineHeight: 1.6 }}>USCIS updated the civics test in 2025. Pick the version that matches your case — you can switch anytime in Settings.</p>
        </div>

        <button onClick={() => setTestVersion("100")} style={{
          width: "100%", textAlign: "left", background: "#1a2535", border: "1.5px solid #4A90D955",
          borderRadius: 20, padding: 20, marginBottom: 14, cursor: "pointer", fontFamily: "inherit", boxShadow: R.shadow,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ width: 50, height: 50, borderRadius: 14, background: "#4A90D922", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24 }}>📘</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 800, fontSize: 15 }}>100 Questions</div>
              <div style={{ fontSize: 11.5, color: "#6b7a99" }}>2008 version · answer 6 of 10 to pass</div>
            </div>
            <span style={{ color: "#4A90D9", fontSize: 18 }}>›</span>
          </div>
        </button>

        <button onClick={() => setTestVersion("128")} style={{
          width: "100%", textAlign: "left", background: "#1a2535", border: "1.5px solid #B2223455",
          borderRadius: 20, padding: 20, marginBottom: 20, cursor: "pointer", fontFamily: "inherit", boxShadow: R.shadow,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ width: 50, height: 50, borderRadius: 14, background: "#B2223422", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24 }}>📗</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 800, fontSize: 15 }}>128 Questions</div>
              <div style={{ fontSize: 11.5, color: "#6b7a99" }}>2025 version · answer 12 of 20 to pass</div>
            </div>
            <span style={{ color: "#B22234", fontSize: 18 }}>›</span>
          </div>
        </button>

        <p style={{ fontSize: 11, color: "#6b7a99", textAlign: "center", lineHeight: 1.6 }}>
          Not sure which one applies to you? Most applicants filing on or after the 2025 rollout use the 128-question version — check your naturalization interview notice or ask your immigration attorney if unsure.
        </p>
      </div>
    );
  }

  /* ============================ HOME ============================ */
  if (screen === "home") return (
    <div style={S.app}>
      {/* Top bar: streak/xp chip left, gear right */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px 0" }}>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 5, background: "#1a2535", borderRadius: R.pill, padding: "6px 12px", boxShadow: R.shadowSm }}>
            <span style={{ fontSize: 13 }}>🔥</span><span style={{ fontSize: 13, fontWeight: 800, color: "#C9A227" }}>{streak}</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 5, background: "#1a2535", borderRadius: R.pill, padding: "6px 12px", boxShadow: R.shadowSm }}>
            <span style={{ fontSize: 13 }}>⚡</span><span style={{ fontSize: 13, fontWeight: 800, color: "#2E7D46" }}>{xp}</span>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => { setManageTab("version"); setScreen("manage"); }} style={{ display: "flex", alignItems: "center", gap: 5, background: "#1a2535", border: "none", borderRadius: R.pill, padding: "6px 12px", fontSize: 11, fontWeight: 700, color: "#6b7a99", cursor: "pointer", boxShadow: R.shadowSm }}>
            {testVersion === "128" ? "📗 128Q" : "📘 100Q"}

        </div>
      </div>

      {/* Centered logo/title */}
      <div style={{ textAlign: "center", padding: "18px 20px 6px" }}>
        <img src="mascot-thumbsup.png" alt="" style={{ width: 64, height: 64, objectFit: "contain", marginBottom: 8 }} />
        <div style={{ fontSize: 20, fontWeight: 900, letterSpacing: "0.08em", textTransform: "uppercase" }}>Civic Test</div>
        <div style={{ fontSize: 12, color: "#6b7a99", marginTop: 4 }}>Everything you need to pass the U.S. civics test</div>
      </div>

      {/* Stat cards: Progress + Streak, icon-left style */}
      <div style={{ display: "flex", gap: 10, padding: "14px 16px 0" }}>
        <div style={{ flex: 1, background: "#1a2535", borderRadius: 18, padding: "14px", boxShadow: R.shadowSm, border: "1px solid rgba(255,255,255,0.05)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <span style={{ fontSize: 16 }}>📊</span>
            <span style={{ fontSize: 10.5, color: "#6b7a99", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Progress</span>
          </div>
          <div style={{ fontSize: 20, fontWeight: 900, color: "#4A90D9" }}>{overallLessonPct}%</div>
          <div style={{ fontSize: 11, color: "#6b7a99", marginTop: 2 }}>{Object.keys(completedLessons).length}/{LESSONS.length} lessons</div>

        <div style={{ flex: 1, background: "#1a2535", borderRadius: 18, padding: "14px", boxShadow: R.shadowSm, border: "1px solid rgba(255,255,255,0.05)" }}>

            <span style={{ fontSize: 16 }}>🏆</span>

                  {preferredAnswers[qq.id] ? `✓ ${preferredAnswers[qq.id]}` : qq.a}
                </div>
                <button onClick={() => { setEditingQ(qq); setEditDraft(preferredAnswers[qq.id] || ""); }} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid #4A90D944", background: "#4A90D90d", color: "#4A90D9", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>✎ Edit</button>
              </div>
            ))}
          </div>
        )}

        {editingQ && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", zIndex: 200 }} onClick={() => setEditingQ(null)}>
            <div onClick={e => e.stopPropagation()} style={{ background: "#1a2535", width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "20px 20px 0 0", padding: 20, maxHeight: "85vh", overflowY: "auto" }}>
              <div style={{ width: 40, height: 4, background: "#2a3a50", borderRadius: 4, margin: "0 auto 16px" }} />
              <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{editingQ.q}</div>
              <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 12 }}>Official: <em>{editingQ.a}</em></div>
              {ANSWER_OPTIONS[editingQ.id] && ANSWER_OPTIONS[editingQ.id].length > 1 && (
                <div style={{ marginBottom: 12 }}>
                  <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 6px", textTransform: "uppercase", letterSpacing: "0.08em" }}>Or pick an accepted answer:</p>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {ANSWER_OPTIONS[editingQ.id].map((opt, i) => (
                      <button key={i} onClick={() => setEditDraft(opt)} style={{ padding: "6px 12px", borderRadius: 8, border: editDraft === opt ? "1.5px solid #2E7D46" : "1px solid #2a3a50", background: editDraft === opt ? "#2E7D4622" : "#0f1923", color: editDraft === opt ? "#2E7D46" : "#a0b0c8", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>{opt}</button>
                    ))}
                  </div>
                </div>
              )}
              <textarea value={editDraft} onChange={e => setEditDraft(e.target.value)} placeholder="Your preferred answer..." rows={3} style={{ width: "100%", padding: 12, borderRadius: 10, border: "1.5px solid #2a3a50", background: "#0f1923", color: "#fff", fontSize: 13, outline: "none", resize: "none", marginBottom: 14, boxSizing: "border-box" }} />
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => { savePreferred(editingQ.id, ""); setEditingQ(null); }} style={{ flex: 1, padding: 13, borderRadius: 10, border: "1.5px solid #2a3a50", background: "transparent", color: "#6b7a99", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Reset</button>
                <button onClick={() => { savePreferred(editingQ.id, editDraft); setEditingQ(null); }} style={{ flex: 1, padding: 13, borderRadius: 10, border: "none", background: "#4A90D9", color: "#fff", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Save</button>
              </div>
            </div>
          </div>
        )}

        {pickFromListQ && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", zIndex: 200 }} onClick={() => setPickFromListQ(null)}>
            <div onClick={e => e.stopPropagation()} style={{ background: "#1a2535", width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "20px 20px 0 0", padding: 20, maxHeight: "85vh", overflowY: "auto" }}>
              <div style={{ width: 40, height: 4, background: "#2a3a50", borderRadius: 4, margin: "0 auto 16px" }} />
              <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#C9A22722", color: "#C9A227", padding: "4px 12px", borderRadius: 20, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>🎯 Q{pickFromListQ.id}</div>
              <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 14, lineHeight: 1.4 }}>{pickFromListQ.q}</div>

              <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 8px", textTransform: "uppercase", letterSpacing: "0.08em" }}>Choose the answer you want to learn:</p>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
                {(ANSWER_OPTIONS[pickFromListQ.id] || [pickFromListQ.a]).map((opt, i) => (
                  <button key={i} onClick={() => setPickAnswerDraft(opt)} style={{
                    textAlign: "left", padding: "12px 14px", borderRadius: 12,
                    border: pickAnswerDraft === opt ? "2px solid #2E7D46" : "1.5px solid #2a3a50",
                    background: pickAnswerDraft === opt ? "#2E7D4622" : "#0f1923",
                    color: pickAnswerDraft === opt ? "#2E7D46" : "#c8d6f0",
                    fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 10,
                  }}>
                    <span style={{ width: 18, height: 18, borderRadius: "50%", border: `1.5px solid ${pickAnswerDraft === opt ? "#2E7D46" : "#4a5568"}`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 10 }}>{pickAnswerDraft === opt ? "●" : ""}</span>
                    {opt}
                  </button>
                ))}
              </div>

              <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 8px", textTransform: "uppercase", letterSpacing: "0.08em" }}>Or type your own wording:</p>
              <textarea value={pickAnswerDraft} onChange={e => setPickAnswerDraft(e.target.value)} placeholder="Type a custom phrasing..." rows={2} style={{ width: "100%", padding: 12, borderRadius: 10, border: "1.5px solid #2a3a50", background: "#0f1923", color: "#fff", fontSize: 13, outline: "none", resize: "none", marginBottom: 14, boxSizing: "border-box" }} />

              <button onClick={() => setPickAddFocus(v => !v)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", borderRadius: 12, border: `1.5px solid ${pickAddFocus ? "#B2223455" : "#2a3a50"}`, background: pickAddFocus ? "#B2223418" : "#0f1923", cursor: "pointer", marginBottom: 16 }}>
                <span style={{ width: 20, height: 20, borderRadius: 6, border: `1.5px solid ${pickAddFocus ? "#B22234" : "#4a5568"}`, background: pickAddFocus ? "#B22234" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: "#fff", flexShrink: 0 }}>{pickAddFocus ? "✓" : ""}</span>
                <span style={{ fontSize: 13, fontWeight: 700, color: pickAddFocus ? "#B22234" : "#6b7a99" }}>🚩 Add to Need More Practice list</span>
              </button>

              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setPickFromListQ(null)} style={{ flex: 1, padding: 13, borderRadius: 10, border: "1.5px solid #2a3a50", background: "transparent", color: "#6b7a99", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Cancel</button>
                <button onClick={confirmFocusPick} disabled={!pickAnswerDraft.trim()} style={{ flex: 1, padding: 13, borderRadius: 10, border: "none", background: pickAnswerDraft.trim() ? "#C9A227" : "#2a3a50", color: pickAnswerDraft.trim() ? "#0f1923" : "#6b7a99", fontWeight: 800, fontSize: 13, cursor: pickAnswerDraft.trim() ? "pointer" : "not-allowed" }}>Save & Focus</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ============================ LESSON ============================ */
  if (screen === "lesson" && q) {
    const correctText = effAnswer(q);
    return (
      <div style={S.app}>
        <div style={{ padding: "16px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={() => setScreen("home")} style={{ background: "transparent", border: "none", color: "#6b7a99", fontSize: 22, cursor: "pointer" }}>✕</button>
          <div style={{ flex: 1, height: 8, background: "#1e2d40", borderRadius: 8 }}>
            <div style={{ height: "100%", width: `${progress}%`, background: `linear-gradient(90deg, ${currentLesson.color}, ${currentLesson.color}cc)`, borderRadius: 8, transition: "width 0.4s ease" }} />
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            {[1,2,3].map(h => (<span key={h} style={{ fontSize: 20, filter: h > hearts ? "grayscale(1) opacity(0.3)" : "none" }}>❤️</span>))}
          </div>
        </div>

        {showXpPop && (<div style={{ position: "fixed", top: 70, right: 20, background: "#2E7D46", color: "#fff", fontWeight: 800, fontSize: 16, padding: "8px 16px", borderRadius: 20, animation: "fadeUp 0.8s ease forwards", zIndex: 100 }}>+{mode === "writing" ? 15 : 10} XP ⚡</div>)}

        <style>{`
          @keyframes fadeUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-30px)} }
          @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
        `}</style>

        <div style={{ padding: "10px 20px 0" }}>
          <div style={{ background: "#1a2535", borderRadius: 22, padding: "24px 20px", marginBottom: 20, border: "1px solid rgba(255,255,255,0.06)", boxShadow: R.shadow }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
              <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: `${currentLesson.color}22`, color: currentLesson.color, padding: "4px 12px", borderRadius: 20, fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                {currentLesson.emoji} {currentLesson.title}
              </div>
              <button onClick={() => toggleStruggle(q.id)} title="Mark as still learning" style={{
                background: practiceList.includes(q.id) ? "#B2223422" : "transparent",
                border: `1.5px solid ${practiceList.includes(q.id) ? "#B22234" : "#2a3a50"}`,
                color: practiceList.includes(q.id) ? "#B22234" : "#6b7a99",
                borderRadius: 10, padding: "5px 9px", fontSize: 13, cursor: "pointer",
              }}>🚩</button>
            </div>
            <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 8px", textTransform: "uppercase", letterSpacing: "0.1em" }}>Q{typeof q.id === "number" ? q.id : "?"}</p>
            <p style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.5, margin: 0, color: "#e8f0fe" }}>{q.q}</p>
          </div>

          {mode === "multiple" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {options.map((opt, i) => {
                const isSelected = selected === opt;
                const isCorrect = opt === correctText;
                let bg = "#1a2535", border = "2px solid #1e2d40", color = "#c8d6f0";
                if (feedback) {
                  if (isCorrect) { bg = "#1a3a1a"; border = "2px solid #2E7D46"; color = "#2E7D46"; }
                  else if (isSelected) { bg = "#3a1a1a"; border = "2px solid #B22234"; color = "#B22234"; }
                } else if (isSelected) { border = `2px solid ${currentLesson.color}`; color = currentLesson.color; }
                return (
                  <button key={i} onClick={() => handleSelect(opt)} style={{ padding: "16px 18px", borderRadius: 14, border, background: bg, color, fontSize: 15, fontWeight: 600, textAlign: "left", cursor: feedback ? "default" : "pointer", display: "flex", alignItems: "center", gap: 12, animation: feedback && isSelected && !isCorrect ? "shake 0.5s ease" : "none" }}>
                    <span style={{ width: 28, height: 28, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 800, flexShrink: 0, background: feedback ? (isCorrect ? "#2E7D4633" : isSelected ? "#B2223433" : "transparent") : "#0f1923", border: feedback ? `1.5px solid ${isCorrect ? "#2E7D46" : isSelected ? "#B22234" : "#1e2d40"}` : "1.5px solid #2a3a50", color: feedback ? (isCorrect ? "#2E7D46" : isSelected ? "#B22234" : "#4a5568") : "#4a5568" }}>
                      {feedback ? (isCorrect ? "✓" : isSelected ? "✗" : String.fromCharCode(65+i)) : String.fromCharCode(65+i)}
                    </span>
                    {opt}
                  </button>
                );
              })}
            </div>
          )}

          {mode === "writing" && (
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <img src="mascot-writing.png" alt="" style={{ width: 32, height: 32, objectFit: "contain", flexShrink: 0 }} />
                <div style={{ fontSize: 12, color: "#6b7a99", lineHeight: 1.6 }}>Type your answer — key words are enough, doesn't need to be exact.</div>
              </div>
              <textarea value={typedAnswer} onChange={e => !writingResult && setTypedAnswer(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleWritingSubmit(); }}} placeholder="Type your answer here..." rows={3} style={{ width: "100%", padding: 16, borderRadius: 14, fontSize: 16, border: writingResult ? `2px solid ${writingResult === "correct" ? "#2E7D46" : "#B22234"}` : `2px solid ${currentLesson.color}66`, background: writingResult ? (writingResult === "correct" ? "#1a3a1a" : "#3a1a1a") : "#1a2535", color: writingResult ? (writingResult === "correct" ? "#2E7D46" : "#B22234") : "#e8f0fe", resize: "none", outline: "none", boxSizing: "border-box", fontFamily: "inherit", animation: writingResult === "wrong" ? "shake 0.5s ease" : "none" }} />
              {!writingResult && (
                <button onClick={handleWritingSubmit} disabled={!typedAnswer.trim()} style={{ width: "100%", marginTop: 12, padding: 16, borderRadius: R.pill, border: "none", background: typedAnswer.trim() ? `linear-gradient(135deg, ${currentLesson.color}, ${currentLesson.color}aa)` : "#1e2d40", color: typedAnswer.trim() ? "#fff" : "#4a5568", fontSize: 16, fontWeight: 800, cursor: typedAnswer.trim() ? "pointer" : "not-allowed", fontFamily: "inherit", boxShadow: typedAnswer.trim() ? `0 6px 18px ${currentLesson.color}55` : "none", transition: "all 0.2s" }}>Check Answer ✓</button>
              )}
            </div>
          )}

          {feedback && (
            <div style={{ marginTop: 20, padding: "16px 20px", borderRadius: 16, background: feedback === "correct" ? "#1a3a1a" : "#3a1a1a", border: `1px solid ${feedback === "correct" ? "#2E7D46" : "#B22234"}44` }}>
              <div style={{ fontSize: 15, fontWeight: 800, color: feedback === "correct" ? "#2E7D46" : "#B22234", marginBottom: feedback === "wrong" ? 4 : 0 }}>{feedback === "correct" ? "✓ Correct!" : "✗ Incorrect"}</div>
              {feedback === "wrong" && (<div style={{ fontSize: 13, color: "#a0b0c8" }}>Answer: <strong style={{ color: "#2E7D46" }}>{correctText}</strong></div>)}
            </div>
          )}

          {feedback && (
            <button onClick={nextQuestion} style={{ width: "100%", marginTop: 14, padding: 16, borderRadius: R.pill, border: "none", background: feedback === "correct" ? "linear-gradient(135deg,#2E7D46,#4C9A6A)" : "linear-gradient(135deg,#B22234,#ff7070)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer", fontFamily: "inherit", boxShadow: feedback === "correct" ? "0 6px 18px #2E7D4655" : "0 6px 18px #B2223455" }}>
              {qIndex + 1 >= questions.length || hearts <= 0 ? "See Results →" : "Continue →"}
            </button>
          )}
        </div>
      </div>
    );
  }

  /* ============================ LEARN MODE ============================ */
  if (screen === "learn") {
    const learnQ = questions[learnIndex];
    const learnData = learnQ ? LEARN[learnQ.id] : null;
    const displayAnswer = learnQ ? effAnswer(learnQ) : "";
    const highlighted = learnQ && learnData ? highlightAnswer(displayAnswer, learnData.core) : (learnQ ? [{ text: displayAnswer, hl: false }] : []);
    const totalCards = questions.length;

    if (learnDone) return (
      <div style={{ ...S.app, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: "40px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>🧠</div>
        <h2 style={{ fontSize: 26, fontWeight: 900, margin: "0 0 8px" }}>All cards reviewed!</h2>
        <p style={{ color: "#6b7a99", fontSize: 13, marginBottom: 32 }}>Ready to test yourself?</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%" }}>
          <button onClick={() => { setMode("multiple"); resetSession(); setQIndex(0); setScreen("lesson"); }} style={{ padding: 16, borderRadius: 16, border: "none", background: "linear-gradient(135deg,#4A90D9,#357ABD)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>🔤 Quiz — Multiple Choice</button>
          <button onClick={() => { setMode("writing"); resetSession(); setQIndex(0); setScreen("lesson"); }} style={{ padding: 16, borderRadius: 16, border: "none", background: "linear-gradient(135deg,#4A90D9,#9B59B6)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>✍️ Quiz — Writing Mode</button>
          <button onClick={() => setScreen("home")} style={{ padding: 14, borderRadius: 16, border: "2px solid #1e2d40", background: "transparent", color: "#6b7a99", fontSize: 14, cursor: "pointer" }}>← Back to Home</button>
        </div>
      </div>
    );

    return (
      <div style={S.app}>
        <div style={{ padding: "16px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={() => setScreen("home")} style={{ background: "transparent", border: "none", color: "#6b7a99", fontSize: 22, cursor: "pointer" }}>✕</button>
          <div style={{ flex: 1, display: "flex", gap: 4, flexWrap: "wrap" }}>
            {questions.map((_, i) => (<div key={i} style={{ width: i === learnIndex ? 18 : 8, height: 8, borderRadius: 4, background: learnKnown.has(questions[i]?.id) ? "#2E7D46" : i === learnIndex ? (currentLesson?.color || "#C9A227") : "#1e2d40", transition: "all 0.3s" }} />))}
          </div>
          <div style={{ fontSize: 13, color: "#6b7a99", fontWeight: 700 }}>{learnIndex+1}/{totalCards}</div>
        </div>

        <style>{`@keyframes slideIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}`}</style>

        <div style={{ padding: "8px 20px 0" }}>
          <div style={{ textAlign: "center", marginBottom: 16 }}>
            <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: currentLesson?.color || "#C9A227", background: `${currentLesson?.color || "#C9A227"}22`, padding: "4px 14px", borderRadius: 20, fontWeight: 700 }}>{currentLesson?.emoji} {currentLesson?.title}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
            <button onClick={() => toggleStruggle(learnQ.id)} style={{ background: practiceList.includes(learnQ.id) ? "#B2223422" : "transparent", border: `1.5px solid ${practiceList.includes(learnQ.id) ? "#B22234" : "#2a3a50"}`, color: practiceList.includes(learnQ.id) ? "#B22234" : "#6b7a99", borderRadius: 10, padding: "5px 9px", fontSize: 13, cursor: "pointer" }}>🚩 Still learning</button>
          </div>
          <div style={{ background: "#1a2535", borderRadius: 22, padding: "24px 20px", marginBottom: 16, border: `1px solid ${currentLesson?.color || "#C9A227"}44`, boxShadow: R.shadow }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <img src="mascot-book.png" alt="" style={{ width: 26, height: 26, objectFit: "contain" }} />
              <p style={{ fontSize: 11, color: "#6b7a99", margin: 0, textTransform: "uppercase", letterSpacing: "0.1em" }}>Learn</p>
            </div>
            <p style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.55, margin: 0, color: "#e8f0fe" }}>{learnQ?.q}</p>
          </div>

          {!learnRevealed ? (
            <div style={{ textAlign: "center", marginBottom: 16 }}>
              <p style={{ fontSize: 13, color: "#6b7a99", fontStyle: "italic", marginBottom: 16 }}>Think about it… then reveal the answer 👇</p>
              <button onClick={() => setLearnRevealed(true)} style={{ width: "100%", padding: 16, borderRadius: R.pill, border: "none", background: `linear-gradient(135deg, ${currentLesson?.color || "#C9A227"}, ${currentLesson?.color || "#C9A227"}aa)`, color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer", boxShadow: `0 6px 18px ${currentLesson?.color || "#C9A227"}55` }}>Reveal Answer ✨</button>
            </div>
          ) : (
            <div style={{ animation: "slideIn 0.3s ease" }}>
              <div style={{ background: "#1a2e1a", border: "1px solid #2E7D4644", borderRadius: 16, padding: 20, marginBottom: 14 }}>
                <p style={{ fontSize: 11, color: "#2E7D46", margin: "0 0 10px", textTransform: "uppercase", letterSpacing: "0.1em" }}>✓ Answer</p>
                <p style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.6, margin: "0 0 14px" }}>
                  {highlighted.map((part, i) => part.hl
                    ? <span key={i} style={{ background: "#C9A22733", color: "#C9A227", borderRadius: 6, padding: "1px 4px", border: "1px solid #C9A22755", fontWeight: 900 }}>{part.text}</span>
                    : <span key={i} style={{ color: "#c0f0d8" }}>{part.text}</span>)}
                </p>
                {learnData && (
                  <div style={{ marginBottom: 12 }}>
                    <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 6px", textTransform: "uppercase", letterSpacing: "0.08em" }}>🔑 Core words:</p>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {learnData.core.map((w, i) => (<span key={i} style={{ background: "#C9A22722", color: "#C9A227", border: "1px solid #C9A22744", borderRadius: 8, padding: "3px 10px", fontSize: 13, fontWeight: 700 }}>{w}</span>))}
                    </div>
                  </div>
                )}
                {learnData?.tip && (<div style={{ background: "#0f1923", borderRadius: 12, padding: "12px 14px", border: "1px solid rgba(255,255,255,0.06)" }}><span style={{ fontSize: 12, color: "#4A90D9", fontWeight: 700 }}>💡 Tip: </span><span style={{ fontSize: 13, color: "#a0b8d0", lineHeight: 1.5 }}>{learnData.tip}</span></div>)}
              </div>
              <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
                <button onClick={() => { if (learnIndex+1 >= questions.length) setLearnDone(true); else { setLearnIndex(i=>i+1); setLearnRevealed(false); } }} style={{ flex: 1, padding: 14, borderRadius: 14, border: "2px solid #B2223444", background: "#3a1a1a", color: "#B22234", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>🔁 Still learning</button>
                <button onClick={() => { setLearnKnown(prev => new Set([...prev, learnQ.id])); if (learnIndex+1 >= questions.length) setLearnDone(true); else { setLearnIndex(i=>i+1); setLearnRevealed(false); } }} style={{ flex: 1, padding: 14, borderRadius: 14, border: "2px solid #2E7D4644", background: "#1a3a1a", color: "#2E7D46", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>✓ Got it!</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ============================ RESULT ============================ */
  if (screen === "result") {
    const passed = finalCorrect >= Math.ceil(questions.length * 0.6);
    return (
      <div style={{ ...S.app, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: "40px 24px", textAlign: "center" }}>
        {passed
          ? <img src="mascot-trophy.png" alt="" style={{ width: 130, height: 130, objectFit: "contain", marginBottom: 8 }} />
          : <div style={{ fontSize: 72, marginBottom: 16 }}>💪</div>}
        <h2 style={{ fontSize: 28, fontWeight: 900, margin: "0 0 8px" }}>{passed ? "Lesson Complete!" : "Keep Practicing!"}</h2>
        <p style={{ color: "#6b7a99", fontSize: 15, marginBottom: 32 }}>{passed ? `You passed ${currentLesson.title}!` : "You need 60% to pass."}</p>
        <div style={{ display: "flex", gap: 20, marginBottom: 36, width: "100%", justifyContent: "center" }}>
          <div style={{ background: "#1a2535", borderRadius: 16, padding: "20px 24px", flex: 1, maxWidth: 120 }}><div style={{ fontSize: 28, fontWeight: 900, color: "#2E7D46" }}>{finalCorrect}</div><div style={{ fontSize: 12, color: "#6b7a99" }}>Correct</div></div>
          <div style={{ background: "#1a2535", borderRadius: 16, padding: "20px 24px", flex: 1, maxWidth: 120 }}><div style={{ fontSize: 28, fontWeight: 900, color: "#C9A227" }}>+{xpEarned}</div><div style={{ fontSize: 12, color: "#6b7a99" }}>XP Earned</div></div>
          <div style={{ background: "#1a2535", borderRadius: 16, padding: "20px 24px", flex: 1, maxWidth: 120 }}><div style={{ fontSize: 28, fontWeight: 900, color: "#B22234" }}>{questions.length - finalCorrect}</div><div style={{ fontSize: 12, color: "#6b7a99" }}>Missed</div></div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%" }}>
          {passed ? (
            <button onClick={() => setScreen("home")} style={{ padding: 16, borderRadius: R.pill, border: "none", background: "linear-gradient(135deg,#2E7D46,#4C9A6A)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer", boxShadow: "0 6px 18px #2E7D4655" }}>Back to Lessons 🏠</button>
          ) : (
            <button onClick={() => startLesson(currentLesson, mode)} style={{ padding: 16, borderRadius: R.pill, border: "none", background: `linear-gradient(135deg, ${currentLesson.color}, ${currentLesson.color}aa)`, color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer", boxShadow: `0 6px 18px ${currentLesson.color}55` }}>Try Again 🔄</button>
          )}
          <button onClick={() => setScreen("home")} style={{ padding: 14, borderRadius: 16, border: "2px solid #1e2d40", background: "transparent", color: "#6b7a99", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>{passed ? "Next Lesson →" : "Back to Home"}</button>
        </div>
      </div>
    );
  }

  /* ============================ TEST RESULT ============================ */
  if (screen === "testresult") {
    const totalCorrect = testResults.filter(r => r.correct).length;
    const passed = totalCorrect >= FULL_TEST_PASS;
    const xpBonus = passed ? 50 : 20;
    return (
      <div style={{ ...S.app, padding: "0 0 60px" }}>
        <div style={{ background: passed ? "linear-gradient(135deg,#1a3a1a,#0f2a0f)" : "linear-gradient(135deg,#3a1a1a,#2a0f0f)", padding: "36px 24px 28px", textAlign: "center", borderBottom: `3px solid ${passed ? "#2E7D46" : "#B22234"}44` }}>
          {passed
            ? <img src="mascot-trophy.png" alt="" style={{ width: 110, height: 110, objectFit: "contain", marginBottom: 6 }} />
            : <div style={{ fontSize: 64, marginBottom: 12 }}>💪</div>}
          <h2 style={{ fontSize: 28, fontWeight: 900, margin: "0 0 6px", color: passed ? "#2E7D46" : "#B22234" }}>{passed ? "YOU PASSED!" : "NOT QUITE YET"}</h2>
          <p style={{ color: "#6b7a99", fontSize: 14, marginBottom: 20 }}>{passed ? "Great job! You would pass the real USCIS civics test." : `You need ${FULL_TEST_PASS}/${FULL_TEST_SIZE} to pass. You got ${totalCorrect}/${FULL_TEST_SIZE}.`}</p>
          <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 100, height: 100, borderRadius: "50%", border: `5px solid ${passed ? "#2E7D46" : "#B22234"}`, background: passed ? "#2E7D4618" : "#B2223418", marginBottom: 20 }}>
            <div><div style={{ fontSize: 32, fontWeight: 900, color: passed ? "#2E7D46" : "#B22234" }}>{totalCorrect}</div><div style={{ fontSize: 13, color: "#6b7a99" }}>/ {FULL_TEST_SIZE}</div></div>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
            <div style={{ background: "#2E7D4622", borderRadius: 12, padding: "10px 16px" }}><div style={{ fontSize: 20, fontWeight: 900, color: "#2E7D46" }}>{totalCorrect}</div><div style={{ fontSize: 11, color: "#6b7a99" }}>Correct</div></div>
            <div style={{ background: "#B2223422", borderRadius: 12, padding: "10px 16px" }}><div style={{ fontSize: 20, fontWeight: 900, color: "#B22234" }}>{FULL_TEST_SIZE-totalCorrect}</div><div style={{ fontSize: 11, color: "#6b7a99" }}>Missed</div></div>
            <div style={{ background: "#C9A22722", borderRadius: 12, padding: "10px 16px" }}><div style={{ fontSize: 20, fontWeight: 900, color: "#C9A227" }}>+{xpBonus}</div><div style={{ fontSize: 11, color: "#6b7a99" }}>XP Bonus</div></div>
          </div>
        </div>
        <div style={{ padding: "20px 16px 0" }}>
          <p style={{ fontSize: 13, fontWeight: 800, color: "#6b7a99", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 12 }}>📋 Question Review</p>
          {testResults.map((r, i) => {
            const isOfficial = OFFICIAL_IDS.includes(r.q.id);
            return (
              <div key={i} style={{ background: r.correct ? "#1a3a1a" : "#2a1a1a", border: `1px solid ${r.correct ? "#2E7D4644" : "#B2223444"}`, borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                  <span style={{ fontSize: 18, flexShrink: 0 }}>{r.correct ? "✅" : "❌"}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                      <span style={{ fontSize: 11, color: "#6b7a99" }}>Q{typeof r.q.id === "number" ? r.q.id : "custom"}</span>
                      {isOfficial && (<span style={{ fontSize: 10, fontWeight: 700, color: "#C9A227", background: "#C9A22722", padding: "1px 6px", borderRadius: 6 }}>⭐ OFFICIAL</span>)}
                    </div>
                    <p style={{ fontSize: 13, fontWeight: 700, color: "#c8d6f0", margin: "0 0 6px", lineHeight: 1.4 }}>{r.q.q}</p>
                    {!r.correct ? (<div><p style={{ fontSize: 12, color: "#B22234", margin: "0 0 3px" }}>Your answer: <span style={{ fontStyle: "italic" }}>{r.userAnswer || "—"}</span></p><p style={{ fontSize: 12, color: "#2E7D46", margin: 0 }}>Correct: <strong>{effAnswer(r.q)}</strong></p></div>) : (<p style={{ fontSize: 12, color: "#2E7D46", margin: 0 }}>✓ {effAnswer(r.q)}</p>)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ padding: "20px 16px 0", display: "flex", flexDirection: "column", gap: 10 }}>
          {[["🔤","multiple","#2E7D46","Choice"],["✍️","writing","#4A90D9","Writing"],["🧠","learn","#C9A227","Learn"]].map(([icon,tm,color,label]) => (
            <button key={tm} onClick={() => startFullTest(tm)} style={{ padding: 14, borderRadius: R.pill, background: `${color}22`, color, fontSize: 13, fontWeight: 800, cursor: "pointer", border: `1.5px solid ${color}55`, boxShadow: `0 3px 10px ${color}22` }}>{icon} New Test — {label} Mode</button>
          ))}
          <button onClick={() => setScreen("home")} style={{ padding: 13, borderRadius: 14, border: "2px solid #1e2d40", background: "transparent", color: "#6b7a99", fontSize: 14, cursor: "pointer" }}>← Back to Home</button>
        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

<script>
  (function () {
    try {
      var code = document.getElementById("app-source").textContent;
      var output = Babel.transform(code, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
      }).code;
      var script = document.createElement("script");
      script.text = output;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div style="padding:24px;color:#FF4B4B;font-family:sans-serif;font-size:13px;white-space:pre-wrap;">' +
        'Failed to load app:\n\n' + (err && err.message ? err.message : String(err)) +
        '</div>';
      console.error("App load error:", err);
    }
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
