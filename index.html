/* ---------- STORAGE (device save, no account) ---------- */
const STORE_KEY = "uscitizen_app_v1";
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveStore(state) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function checkAnswer(qId, userAnswer, preferredText) {
  const lower = (userAnswer || "").toLowerCase().trim();
  if (!lower) return false;
  const keys = KEYWORDS[qId] || [];
  const prefWords = preferredText
    ? preferredText.toLowerCase().split(/\s+/).filter(w => w.length > 3)
    : [];
  const allKeys = [...keys, ...prefWords];
  const multiPart = [9,17,36,45,51,55,64,81,100];
  const needed = multiPart.includes(qId) ? 2 : 1;
  let matched = 0;
  for (const kw of allKeys) {
    if (lower.includes(kw.toLowerCase())) matched++;
    if (matched >= needed) return true;
  }
  return false;
}

function highlightAnswer(answer, coreWords) {
  if (!coreWords || coreWords.length === 0) return [{ text: answer, hl: false }];
  const sorted = [...coreWords].sort((a, b) => b.length - a.length);
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${sorted.map(esc).join('|')})`, 'gi');
  let m; const matches = [];
  while ((m = regex.exec(answer)) !== null) matches.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
  if (matches.length === 0) return [{ text: answer, hl: false }];
  const parts = []; let lastEnd = 0;
  matches.forEach(mm => {
    if (mm.start > lastEnd) parts.push({ text: answer.slice(lastEnd, mm.start), hl: false });
    parts.push({ text: mm.text, hl: true });
    lastEnd = mm.end;
  });
  if (lastEnd < answer.length) parts.push({ text: answer.slice(lastEnd), hl: false });
  return parts;
}

        o.frequency.setValueAtTime(f, ctx.currentTime + s);
        g.gain.setValueAtTime(0.25, ctx.currentTime + s);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + s + d);
        o.start(ctx.currentTime + s); o.stop(ctx.currentTime + s + d);

        o.frequency.setValueAtTime(f, ctx.currentTime + s);

      if (isFullTest) {
        setTestsTaken(t => t + 1);
        if (finalC >= 6) { setTestsPassed(p => p + 1); setStreak(s => s + 1); }
        setScreen("testresult");
      } else {
        if (finalC >= Math.ceil(questions.length * 0.6)) {
          setCompletedLessons(prev => ({ ...prev, [currentLesson.id]: true }));
          setStreak(s => s + 1);
        }
        setScreen("result");
      }
    } else {
      setQIndex(nextIdx); setSelected(null); setFeedback(null);
      setTypedAnswer(""); setWritingResult(null);
    }
  }

  function addCustomQuestion() {
    if (!customDraft.q.trim() || !customDraft.a.trim()) return;
    const newId = "c" + Date.now();
    setCustomQuestions(prev => [...prev, {
      id: newId, category: "Custom", emoji: "✏️",
      q: customDraft.q.trim(), a: customDraft.a.trim(),
      wrong: ["Not this one", "Also incorrect", "Try again"], custom: true,
    }]);
    setCustomDraft({ q: "", a: "" });
    setShowCustomForm(false);
  }
  function deleteCustomQuestion(id) {
    setCustomQuestions(prev => prev.filter(q => q.id !== id));
    setPracticeList(prev => prev.filter(pid => pid !== id));
  }
  function savePreferred(qId, text) {
    setPreferredAnswers(prev => {
      const next = { ...prev };
      if (!text || !text.trim()) delete next[qId];
      else next[qId] = text.trim();
      return next;
    });
  }

  const q = questions[qIndex];
  const options = q && mode === "multiple" ? getOptions(q, effAnswer(q)) : [];
  const progress = questions.length > 0 ? (qIndex / questions.length) * 100 : 0;
  const finalCorrect = feedback === "correct" ? correctCount + 1 : correctCount;

  const S = { app: { minHeight: "100vh", background: "#0f1923", fontFamily: "'Inter','Helvetica Neue',sans-serif", color: "#fff", maxWidth: 480, margin: "0 auto", padding: "0 0 40px", position: "relative" } };

  /* ============================ HOME ============================ */
  if (screen === "home") return (
    <div style={S.app}>
      <div style={{ padding: "20px 20px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 11, color: "#6b7a99", textTransform: "uppercase", letterSpacing: "0.1em" }}>Streak</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#FF9F00" }}>🔥 {streak}</div>
          </div>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 11, color: "#6b7a99", textTransform: "uppercase", letterSpacing: "0.1em" }}>XP</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#58CC02" }}>⚡ {xp}</div>
          </div>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 11, color: "#6b7a99", textTransform: "uppercase", letterSpacing: "0.1em" }}>Level</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#CE82FF" }}>🏆 {level}</div>
          </div>
        </div>
        <button onClick={() => setScreen("manage")} style={{ background: "rgba(255,255,255,0.08)", border: "none", borderRadius: 12, width: 40, height: 40, fontSize: 18, cursor: "pointer" }}>⚙️</button>
      </div>

      <div style={{ padding: "12px 20px 0" }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#6b7a99", marginBottom: 5 }}>
          <span>Level {level}</span><span>{xpInLevel}/100 XP</span>
        </div>
        <div style={{ height: 6, background: "#1e2d40", borderRadius: 6 }}>
          <div style={{ height: "100%", width: `${xpInLevel}%`, background: "linear-gradient(90deg,#58CC02,#89E219)", borderRadius: 6, transition: "width 0.5s" }} />
        </div>
      </div>

      <div style={{ padding: "24px 20px 8px", textAlign: "center" }}>
        <h1 style={{ fontSize: 24, fontWeight: 900, margin: "0 0 4px", letterSpacing: "-0.02em" }}>🇺🇸 U.S. Citizenship Test</h1>
        <p style={{ color: "#6b7a99", fontSize: 13, margin: 0 }}>{Object.keys(completedLessons).length}/{LESSONS.length} lessons complete</p>
      </div>

      {practiceList.length > 0 && (
        <div style={{ padding: "8px 16px 0" }}>
          <div style={{ background: "linear-gradient(135deg,#FF4B4B22,#FF4B4B11)", border: "1.5px solid #FF4B4B55", borderRadius: 16, padding: "16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
              <span style={{ fontSize: 24 }}>🚩</span>
              <div>
                <div style={{ fontWeight: 800, fontSize: 14 }}>Need More Practice</div>
                <div style={{ fontSize: 12, color: "#6b7a99" }}>{practiceList.length} question{practiceList.length !== 1 ? "s" : ""} you're still learning</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => startLesson({ id: "practice", title: "Need More Practice", emoji: "🚩", color: "#FF4B4B", practiceList: true }, "writing")} style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", background: "#FF4B4B", color: "#fff", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>✍️ Write</button>
              <button onClick={() => startLesson({ id: "practice", title: "Need More Practice", emoji: "🚩", color: "#FF4B4B", practiceList: true }, "learn")} style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", background: "#1e2d40", color: "#FF9F00", fontWeight: 800, fontSize: 12, cursor: "pointer" }}>🧠 Learn</button>
            </div>
          </div>
        </div>
      )}

      <div style={{ padding: "16px 16px 12px", display: "flex", gap: 8 }}>
        <button onClick={() => setMode("multiple")} style={{ flex: 1, padding: "10px", borderRadius: 12, border: mode === "multiple" ? "2px solid #58CC02" : "2px solid #1e2d40", background: mode === "multiple" ? "#58CC0222" : "#1a2535", color: mode === "multiple" ? "#58CC02" : "#6b7a99", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>🔤 Choice</button>
        <button onClick={() => setMode("writing")} style={{ flex: 1, padding: "10px", borderRadius: 12, border: mode === "writing" ? "2px solid #CE82FF" : "2px solid #1e2d40", background: mode === "writing" ? "#CE82FF22" : "#1a2535", color: mode === "writing" ? "#CE82FF" : "#6b7a99", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>✍️ Writing</button>
        <button onClick={() => setMode("learn")} style={{ flex: 1, padding: "10px", borderRadius: 12, border: mode === "learn" ? "2px solid #FF9F00" : "2px solid #1e2d40", background: mode === "learn" ? "#FF9F0022" : "#1a2535", color: mode === "learn" ? "#FF9F00" : "#6b7a99", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>🧠 Learn</button>
      </div>

      <div style={{ padding: "0 16px 8px" }}>
        <div style={{ background: "linear-gradient(135deg,#FF9F0022,#FF6B0011)", border: "2px solid #FF9F0066", borderRadius: 20, padding: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
            <div style={{ fontSize: 36 }}>🎯</div>
            <div>
              <div style={{ fontSize: 17, fontWeight: 900, color: "#FF9F00" }}>Full Practice Test</div>
              <div style={{ fontSize: 12, color: "#6b7a99" }}>10 random questions · just like the real USCIS test</div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {[["🔤","multiple","#58CC02","Choice"],["✍️","writing","#CE82FF","Write"],["🧠","learn","#FF9F00","Learn"]].map(([icon,tm,color,label]) => (
              <button key={tm} onClick={() => startFullTest(tm)} style={{ flex: 1, padding: "11px 4px", borderRadius: 12, background: `${color}22`, color, fontSize: 12, fontWeight: 800, cursor: "pointer", border: `1.5px solid ${color}55` }}>{icon} {label}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{ padding: "8px 16px" }}>
        {LESSONS.map((lesson) => {
          const done = !!completedLessons[lesson.id];
          return (
            <button key={lesson.id} onClick={() => startLesson(lesson, mode)} style={{
              width: "100%", display: "flex", alignItems: "center", gap: 16, padding: 16, marginBottom: 10, borderRadius: 16,
              border: done ? `2px solid ${lesson.color}66` : `2px solid ${lesson.color}44`,
              background: done ? `linear-gradient(135deg, ${lesson.color}22, ${lesson.color}11)` : "#1a2535",
              cursor: "pointer", textAlign: "left", fontFamily: "inherit",
            }}>
              <div style={{ width: 52, height: 52, borderRadius: 14, background: `${lesson.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, flexShrink: 0 }}>{lesson.emoji}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: "#fff", marginBottom: 3 }}>{lesson.title}</div>
                <div style={{ fontSize: 12, color: "#6b7a99" }}>{lesson.ids.length} questions · {lesson.ids.length * 10} XP</div>
              </div>
              {done && <div style={{ fontSize: 22 }}>✅</div>}
              {!done && <div style={{ padding: "6px 14px", borderRadius: 20, background: lesson.color, fontSize: 12, fontWeight: 700, color: "#fff" }}>{mode === "writing" ? "✍️ WRITE" : mode === "learn" ? "🧠 LEARN" : "START"}</div>}
            </button>
          );
        })}
        {customQuestions.length > 0 && (
          <button onClick={() => startLesson({ id: "custom", title: "My Custom Questions", emoji: "✏️", color: "#E91E63", custom: true, ids: customQuestions.map(q=>q.id) }, mode)} style={{
            width: "100%", display: "flex", alignItems: "center", gap: 16, padding: 16, marginBottom: 10, borderRadius: 16,
            border: "2px solid #E91E6344", background: "#1a2535", cursor: "pointer", textAlign: "left", fontFamily: "inherit",
          }}>
            <div style={{ width: 52, height: 52, borderRadius: 14, background: "#E91E6333", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>✏️</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#fff", marginBottom: 3 }}>My Custom Questions</div>
              <div style={{ fontSize: 12, color: "#6b7a99" }}>{customQuestions.length} question{customQuestions.length !== 1 ? "s" : ""}</div>
            </div>
          </button>
        )}
      </div>
    </div>
  );

  /* ============================ MANAGE ============================ */
  if (screen === "manage") {
    const pool = allPool();
    const filtered = answerFilter ? pool.filter(qq => qq.q.toLowerCase().includes(answerFilter.toLowerCase())) : pool;
    return (
      <div style={S.app}>
        <div style={{ padding: "16px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={() => setScreen("home")} style={{ background: "transparent", border: "none", color: "#6b7a99", fontSize: 22, cursor: "pointer" }}>✕</button>
          <div style={{ fontSize: 18, fontWeight: 800 }}>Manage</div>
        </div>

        <div style={{ display: "flex", gap: 8, padding: "0 16px 16px" }}>
          {[["practice","🚩 Practice List"],["custom","✏️ My Questions"],["answers","📝 Edit Answers"]].map(([id,label]) => (
            <button key={id} onClick={() => setManageTab(id)} style={{
              flex: 1, padding: "10px 6px", borderRadius: 12, fontSize: 11, fontWeight: 700, cursor: "pointer",
              border: manageTab === id ? "2px solid #4A90D9" : "2px solid #1e2d40",
              background: manageTab === id ? "#4A90D922" : "#1a2535",
              color: manageTab === id ? "#4A90D9" : "#6b7a99",
            }}>{label}</button>
          ))}
        </div>

        {manageTab === "practice" && (
          <div style={{ padding: "0 16px" }}>
            <p style={{ fontSize: 12, color: "#6b7a99", marginBottom: 14, lineHeight: 1.5 }}>
              Questions you get wrong are automatically added here. Get them right once to clear them, or remove manually.
            </p>
            {practiceList.length === 0 ? (
              <div style={{ textAlign: "center", padding: "40px 0", color: "#4a5568" }}>
                <div style={{ fontSize: 40, marginBottom: 10 }}>🎉</div>
                <div style={{ fontSize: 13 }}>Nothing to practice — you're all caught up!</div>
              </div>
            ) : pool.filter(qq => practiceList.includes(qq.id)).map(qq => (
              <div key={qq.id} style={{ background: "#1a2535", border: "1px solid #FF4B4B33", borderRadius: 12, padding: "12px 14px", marginBottom: 8, display: "flex", alignItems: "flex-start", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>{qq.q}</div>
                  <div style={{ fontSize: 11, color: "#58CC02" }}>{preferredAnswers[qq.id] || qq.a}</div>
                </div>
                <button onClick={() => toggleStruggle(qq.id)} style={{ background: "none", border: "none", color: "#FF4B4B", fontSize: 13, cursor: "pointer", flexShrink: 0 }}>✕ Remove</button>
              </div>
            ))}
          </div>
        )}

        {manageTab === "custom" && (
          <div style={{ padding: "0 16px" }}>
            <button onClick={() => setShowCustomForm(v => !v)} style={{ width: "100%", padding: 14, borderRadius: 14, border: "none", background: "linear-gradient(135deg,#E91E63,#ff6b95)", color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer", marginBottom: 14 }}>
              {showCustomForm ? "Cancel" : "➕ Add Your Own Question"}
            </button>
            {showCustomForm && (
              <div style={{ background: "#1a2535", border: "1.5px solid #E91E6344", borderRadius: 16, padding: 16, marginBottom: 16 }}>
                <input placeholder="Question..." value={customDraft.q} onChange={e => setCustomDraft(d => ({ ...d, q: e.target.value }))} style={{ width: "100%", padding: 12, borderRadius: 10, border: "1.5px solid #2a3a50", background: "#0f1923", color: "#fff", fontSize: 13, marginBottom: 10, outline: "none", boxSizing: "border-box" }} />
                <input placeholder="Answer..." value={customDraft.a} onChange={e => setCustomDraft(d => ({ ...d, a: e.target.value }))} style={{ width: "100%", padding: 12, borderRadius: 10, border: "1.5px solid #2a3a50", background: "#0f1923", color: "#fff", fontSize: 13, marginBottom: 14, outline: "none", boxSizing: "border-box" }} />
                <button onClick={addCustomQuestion} style={{ width: "100%", padding: 12, borderRadius: 10, border: "none", background: "#E91E63", color: "#fff", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Save Question</button>
              </div>
            )}
            {customQuestions.length === 0 ? (
              <div style={{ textAlign: "center", padding: "30px 0", color: "#4a5568", fontSize: 13 }}>No custom questions yet.</div>
            ) : customQuestions.map(qq => (
              <div key={qq.id} style={{ background: "#1a2535", border: "1px solid #2a3a50", borderRadius: 12, padding: "12px 14px", marginBottom: 8, display: "flex", alignItems: "flex-start", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>✏️ {qq.q}</div>
                  <div style={{ fontSize: 11, color: "#58CC02" }}>{qq.a}</div>
                </div>
                <button onClick={() => deleteCustomQuestion(qq.id)} style={{ background: "none", border: "none", color: "#FF4B4B", fontSize: 15, cursor: "pointer", flexShrink: 0 }}>🗑️</button>
              </div>
            ))}
          </div>
        )}

        {manageTab === "answers" && (
          <div style={{ padding: "0 16px" }}>
            <p style={{ fontSize: 12, color: "#6b7a99", marginBottom: 12, lineHeight: 1.5 }}>
              Change any official answer to a phrasing that's easier for you to remember.
            </p>
            <input placeholder="🔍 Search questions..." value={answerFilter} onChange={e => setAnswerFilter(e.target.value)} style={{ width: "100%", padding: 12, borderRadius: 10, border: "1.5px solid #2a3a50", background: "#1a2535", color: "#fff", fontSize: 13, marginBottom: 14, outline: "none", boxSizing: "border-box" }} />
            {filtered.slice(0, 40).map(qq => (
              <div key={qq.id} style={{ background: "#1a2535", border: "1px solid #2a3a50", borderRadius: 12, padding: "12px 14px", marginBottom: 8 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>{qq.custom ? "✏️ " : ""}{qq.q}</div>
                <div style={{ fontSize: 11, color: preferredAnswers[qq.id] ? "#58CC02" : "#6b7a99", fontStyle: preferredAnswers[qq.id] ? "normal" : "italic", marginBottom: 8 }}>
                  {preferredAnswers[qq.id] ? `✓ ${preferredAnswers[qq.id]}` : qq.a}
                </div>
                <button onClick={() => { setEditingQ(qq); setEditDraft(preferredAnswers[qq.id] || ""); }} style={{ padding: "6px 12px", borderRadius: 8, border: "1px solid #4A90D944", background: "#4A90D90d", color: "#4A90D9", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>✎ Edit</button>
              </div>
            ))}
          </div>
        )}

        {editingQ && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", zIndex: 200 }} onClick={() => setEditingQ(null)}>
            <div onClick={e => e.stopPropagation()} style={{ background: "#1a2535", width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "20px 20px 0 0", padding: 20 }}>
              <div style={{ width: 40, height: 4, background: "#2a3a50", borderRadius: 4, margin: "0 auto 16px" }} />
              <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{editingQ.q}</div>
              <div style={{ fontSize: 11, color: "#6b7a99", marginBottom: 12 }}>Official: <em>{editingQ.a}</em></div>
              <textarea value={editDraft} onChange={e => setEditDraft(e.target.value)} placeholder="Your preferred answer..." rows={3} style={{ width: "100%", padding: 12, borderRadius: 10, border: "1.5px solid #2a3a50", background: "#0f1923", color: "#fff", fontSize: 13, outline: "none", resize: "none", marginBottom: 14, boxSizing: "border-box" }} />
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => { savePreferred(editingQ.id, ""); setEditingQ(null); }} style={{ flex: 1, padding: 13, borderRadius: 10, border: "1.5px solid #2a3a50", background: "transparent", color: "#6b7a99", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Reset</button>
                <button onClick={() => { savePreferred(editingQ.id, editDraft); setEditingQ(null); }} style={{ flex: 1, padding: 13, borderRadius: 10, border: "none", background: "#4A90D9", color: "#fff", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>Save</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ============================ LESSON ============================ */
  if (screen === "lesson" && q) {
    const correctText = effAnswer(q);
    return (
      <div style={S.app}>
        <div style={{ padding: "16px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={() => setScreen("home")} style={{ background: "transparent", border: "none", color: "#6b7a99", fontSize: 22, cursor: "pointer" }}>✕</button>
          <div style={{ flex: 1, height: 8, background: "#1e2d40", borderRadius: 8 }}>
            <div style={{ height: "100%", width: `${progress}%`, background: `linear-gradient(90deg, ${currentLesson.color}, ${currentLesson.color}cc)`, borderRadius: 8, transition: "width 0.4s ease" }} />
          </div>
          <div style={{ display: "flex", gap: 4 }}>
            {[1,2,3].map(h => (<span key={h} style={{ fontSize: 20, filter: h > hearts ? "grayscale(1) opacity(0.3)" : "none" }}>❤️</span>))}
          </div>
        </div>

        {showXpPop && (<div style={{ position: "fixed", top: 70, right: 20, background: "#58CC02", color: "#fff", fontWeight: 800, fontSize: 16, padding: "8px 16px", borderRadius: 20, animation: "fadeUp 0.8s ease forwards", zIndex: 100 }}>+{mode === "writing" ? 15 : 10} XP ⚡</div>)}

        <style>{`
          @keyframes fadeUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-30px)} }
          @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
        `}</style>

        <div style={{ padding: "10px 20px 0" }}>
          <div style={{ background: "#1a2535", borderRadius: 20, padding: "24px 20px", marginBottom: 20, border: "1px solid rgba(255,255,255,0.06)" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
              <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: `${currentLesson.color}22`, color: currentLesson.color, padding: "4px 12px", borderRadius: 20, fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                {currentLesson.emoji} {currentLesson.title}
              </div>
              <button onClick={() => toggleStruggle(q.id)} title="Mark as still learning" style={{
                background: practiceList.includes(q.id) ? "#FF4B4B22" : "transparent",
                border: `1.5px solid ${practiceList.includes(q.id) ? "#FF4B4B" : "#2a3a50"}`,
                color: practiceList.includes(q.id) ? "#FF4B4B" : "#6b7a99",
                borderRadius: 10, padding: "5px 9px", fontSize: 13, cursor: "pointer",
              }}>🚩</button>
            </div>
            <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 8px", textTransform: "uppercase", letterSpacing: "0.1em" }}>Q{typeof q.id === "number" ? q.id : "?"}</p>
            <p style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.5, margin: 0, color: "#e8f0fe" }}>{q.q}</p>
          </div>

          {mode === "multiple" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {options.map((opt, i) => {
                const isSelected = selected === opt;
                const isCorrect = opt === correctText;
                let bg = "#1a2535", border = "2px solid #1e2d40", color = "#c8d6f0";
                if (feedback) {
                  if (isCorrect) { bg = "#1a3a1a"; border = "2px solid #58CC02"; color = "#58CC02"; }
                  else if (isSelected) { bg = "#3a1a1a"; border = "2px solid #FF4B4B"; color = "#FF4B4B"; }
                } else if (isSelected) { border = `2px solid ${currentLesson.color}`; color = currentLesson.color; }
                return (
                  <button key={i} onClick={() => handleSelect(opt)} style={{ padding: "16px 18px", borderRadius: 14, border, background: bg, color, fontSize: 15, fontWeight: 600, textAlign: "left", cursor: feedback ? "default" : "pointer", display: "flex", alignItems: "center", gap: 12, animation: feedback && isSelected && !isCorrect ? "shake 0.5s ease" : "none" }}>
                    <span style={{ width: 28, height: 28, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 800, flexShrink: 0, background: feedback ? (isCorrect ? "#58CC0233" : isSelected ? "#FF4B4B33" : "transparent") : "#0f1923", border: feedback ? `1.5px solid ${isCorrect ? "#58CC02" : isSelected ? "#FF4B4B" : "#1e2d40"}` : "1.5px solid #2a3a50", color: feedback ? (isCorrect ? "#58CC02" : isSelected ? "#FF4B4B" : "#4a5568") : "#4a5568" }}>
                      {feedback ? (isCorrect ? "✓" : isSelected ? "✗" : String.fromCharCode(65+i)) : String.fromCharCode(65+i)}
                    </span>
                    {opt}
                  </button>
                );
              })}
            </div>
          )}

          {mode === "writing" && (
            <div>
              <div style={{ fontSize: 12, color: "#6b7a99", marginBottom: 10, lineHeight: 1.6 }}>✍️ Type your answer — key words are enough, doesn't need to be exact.</div>
              <textarea value={typedAnswer} onChange={e => !writingResult && setTypedAnswer(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleWritingSubmit(); }}} placeholder="Type your answer here..." rows={3} style={{ width: "100%", padding: 16, borderRadius: 14, fontSize: 16, border: writingResult ? `2px solid ${writingResult === "correct" ? "#58CC02" : "#FF4B4B"}` : `2px solid ${currentLesson.color}66`, background: writingResult ? (writingResult === "correct" ? "#1a3a1a" : "#3a1a1a") : "#1a2535", color: writingResult ? (writingResult === "correct" ? "#58CC02" : "#FF4B4B") : "#e8f0fe", resize: "none", outline: "none", boxSizing: "border-box", fontFamily: "inherit", animation: writingResult === "wrong" ? "shake 0.5s ease" : "none" }} />
              {!writingResult && (
                <button onClick={handleWritingSubmit} disabled={!typedAnswer.trim()} style={{ width: "100%", marginTop: 12, padding: 16, borderRadius: 16, border: "none", background: typedAnswer.trim() ? `linear-gradient(135deg, ${currentLesson.color}, ${currentLesson.color}aa)` : "#1e2d40", color: typedAnswer.trim() ? "#fff" : "#4a5568", fontSize: 16, fontWeight: 800, cursor: typedAnswer.trim() ? "pointer" : "not-allowed", fontFamily: "inherit" }}>Check Answer ✓</button>
              )}
            </div>
          )}

          {feedback && (
            <div style={{ marginTop: 20, padding: "16px 20px", borderRadius: 16, background: feedback === "correct" ? "#1a3a1a" : "#3a1a1a", border: `1px solid ${feedback === "correct" ? "#58CC02" : "#FF4B4B"}44` }}>
              <div style={{ fontSize: 15, fontWeight: 800, color: feedback === "correct" ? "#58CC02" : "#FF4B4B", marginBottom: feedback === "wrong" ? 4 : 0 }}>{feedback === "correct" ? "✓ Correct!" : "✗ Incorrect"}</div>
              {feedback === "wrong" && (<div style={{ fontSize: 13, color: "#a0b0c8" }}>Answer: <strong style={{ color: "#58CC02" }}>{correctText}</strong></div>)}
            </div>
          )}

          {feedback && (
            <button onClick={nextQuestion} style={{ width: "100%", marginTop: 14, padding: 16, borderRadius: 16, border: "none", background: feedback === "correct" ? "linear-gradient(135deg,#58CC02,#89E219)" : "linear-gradient(135deg,#FF4B4B,#ff7070)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer", fontFamily: "inherit" }}>
              {qIndex + 1 >= questions.length || hearts <= 0 ? "See Results →" : "Continue →"}
            </button>
          )}
        </div>
      </div>
    );
  }

  /* ============================ LEARN MODE ============================ */
  if (screen === "learn") {
    const learnQ = questions[learnIndex];
    const learnData = learnQ ? LEARN[learnQ.id] : null;
    const displayAnswer = learnQ ? effAnswer(learnQ) : "";
    const highlighted = learnQ && learnData ? highlightAnswer(displayAnswer, learnData.core) : (learnQ ? [{ text: displayAnswer, hl: false }] : []);
    const totalCards = questions.length;

    if (learnDone) return (
      <div style={{ ...S.app, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: "40px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 64, marginBottom: 16 }}>🧠</div>
        <h2 style={{ fontSize: 26, fontWeight: 900, margin: "0 0 8px" }}>All cards reviewed!</h2>
        <p style={{ color: "#6b7a99", fontSize: 13, marginBottom: 32 }}>Ready to test yourself?</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%" }}>
          <button onClick={() => { setMode("multiple"); resetSession(); setQIndex(0); setScreen("lesson"); }} style={{ padding: 16, borderRadius: 16, border: "none", background: "linear-gradient(135deg,#4A90D9,#357ABD)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>🔤 Quiz — Multiple Choice</button>
          <button onClick={() => { setMode("writing"); resetSession(); setQIndex(0); setScreen("lesson"); }} style={{ padding: 16, borderRadius: 16, border: "none", background: "linear-gradient(135deg,#CE82FF,#9B59B6)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>✍️ Quiz — Writing Mode</button>
          <button onClick={() => setScreen("home")} style={{ padding: 14, borderRadius: 16, border: "2px solid #1e2d40", background: "transparent", color: "#6b7a99", fontSize: 14, cursor: "pointer" }}>← Back to Home</button>
        </div>
      </div>
    );

    return (
      <div style={S.app}>
        <div style={{ padding: "16px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={() => setScreen("home")} style={{ background: "transparent", border: "none", color: "#6b7a99", fontSize: 22, cursor: "pointer" }}>✕</button>
          <div style={{ flex: 1, display: "flex", gap: 4, flexWrap: "wrap" }}>
            {questions.map((_, i) => (<div key={i} style={{ width: i === learnIndex ? 18 : 8, height: 8, borderRadius: 4, background: learnKnown.has(questions[i]?.id) ? "#58CC02" : i === learnIndex ? (currentLesson?.color || "#FF9F00") : "#1e2d40", transition: "all 0.3s" }} />))}
          </div>
          <div style={{ fontSize: 13, color: "#6b7a99", fontWeight: 700 }}>{learnIndex+1}/{totalCards}</div>
        </div>

        <style>{`@keyframes slideIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}`}</style>

        <div style={{ padding: "8px 20px 0" }}>
          <div style={{ textAlign: "center", marginBottom: 16 }}>
            <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: currentLesson?.color || "#FF9F00", background: `${currentLesson?.color || "#FF9F00"}22`, padding: "4px 14px", borderRadius: 20, fontWeight: 700 }}>{currentLesson?.emoji} {currentLesson?.title}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
            <button onClick={() => toggleStruggle(learnQ.id)} style={{ background: practiceList.includes(learnQ.id) ? "#FF4B4B22" : "transparent", border: `1.5px solid ${practiceList.includes(learnQ.id) ? "#FF4B4B" : "#2a3a50"}`, color: practiceList.includes(learnQ.id) ? "#FF4B4B" : "#6b7a99", borderRadius: 10, padding: "5px 9px", fontSize: 13, cursor: "pointer" }}>🚩 Still learning</button>
          </div>
          <div style={{ background: "#1a2535", borderRadius: 20, padding: "24px 20px", marginBottom: 16, border: `1px solid ${currentLesson?.color || "#FF9F00"}44` }}>
            <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 10px", textTransform: "uppercase", letterSpacing: "0.1em" }}>🧠 Learn</p>
            <p style={{ fontSize: 18, fontWeight: 700, lineHeight: 1.55, margin: 0, color: "#e8f0fe" }}>{learnQ?.q}</p>
          </div>

          {!learnRevealed ? (
            <div style={{ textAlign: "center", marginBottom: 16 }}>
              <p style={{ fontSize: 13, color: "#6b7a99", fontStyle: "italic", marginBottom: 16 }}>Think about it… then reveal the answer 👇</p>
              <button onClick={() => setLearnRevealed(true)} style={{ width: "100%", padding: 16, borderRadius: 16, border: "none", background: `linear-gradient(135deg, ${currentLesson?.color || "#FF9F00"}, ${currentLesson?.color || "#FF9F00"}aa)`, color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>Reveal Answer ✨</button>
            </div>
          ) : (
            <div style={{ animation: "slideIn 0.3s ease" }}>
              <div style={{ background: "#1a2e1a", border: "1px solid #58CC0244", borderRadius: 16, padding: 20, marginBottom: 14 }}>
                <p style={{ fontSize: 11, color: "#58CC02", margin: "0 0 10px", textTransform: "uppercase", letterSpacing: "0.1em" }}>✓ Answer</p>
                <p style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.6, margin: "0 0 14px" }}>
                  {highlighted.map((part, i) => part.hl
                    ? <span key={i} style={{ background: "#FF9F0033", color: "#FF9F00", borderRadius: 6, padding: "1px 4px", border: "1px solid #FF9F0055", fontWeight: 900 }}>{part.text}</span>
                    : <span key={i} style={{ color: "#c0f0d8" }}>{part.text}</span>)}
                </p>
                {learnData && (
                  <div style={{ marginBottom: 12 }}>
                    <p style={{ fontSize: 11, color: "#6b7a99", margin: "0 0 6px", textTransform: "uppercase", letterSpacing: "0.08em" }}>🔑 Core words:</p>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {learnData.core.map((w, i) => (<span key={i} style={{ background: "#FF9F0022", color: "#FF9F00", border: "1px solid #FF9F0044", borderRadius: 8, padding: "3px 10px", fontSize: 13, fontWeight: 700 }}>{w}</span>))}
                    </div>
                  </div>
                )}
                {learnData?.tip && (<div style={{ background: "#0f1923", borderRadius: 12, padding: "12px 14px", border: "1px solid rgba(255,255,255,0.06)" }}><span style={{ fontSize: 12, color: "#CE82FF", fontWeight: 700 }}>💡 Tip: </span><span style={{ fontSize: 13, color: "#a0b8d0", lineHeight: 1.5 }}>{learnData.tip}</span></div>)}
              </div>
              <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
                <button onClick={() => { if (learnIndex+1 >= questions.length) setLearnDone(true); else { setLearnIndex(i=>i+1); setLearnRevealed(false); } }} style={{ flex: 1, padding: 14, borderRadius: 14, border: "2px solid #FF4B4B44", background: "#3a1a1a", color: "#FF4B4B", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>🔁 Still learning</button>
                <button onClick={() => { setLearnKnown(prev => new Set([...prev, learnQ.id])); if (learnIndex+1 >= questions.length) setLearnDone(true); else { setLearnIndex(i=>i+1); setLearnRevealed(false); } }} style={{ flex: 1, padding: 14, borderRadius: 14, border: "2px solid #58CC0244", background: "#1a3a1a", color: "#58CC02", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>✓ Got it!</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ============================ RESULT ============================ */
  if (screen === "result") {
    const passed = finalCorrect >= Math.ceil(questions.length * 0.6);
    return (
      <div style={{ ...S.app, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: "40px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 72, marginBottom: 16 }}>{passed ? "🎉" : "💪"}</div>
        <h2 style={{ fontSize: 28, fontWeight: 900, margin: "0 0 8px" }}>{passed ? "Lesson Complete!" : "Keep Practicing!"}</h2>
        <p style={{ color: "#6b7a99", fontSize: 15, marginBottom: 32 }}>{passed ? `You passed ${currentLesson.title}!` : "You need 60% to pass."}</p>
        <div style={{ display: "flex", gap: 20, marginBottom: 36, width: "100%", justifyContent: "center" }}>
          <div style={{ background: "#1a2535", borderRadius: 16, padding: "20px 24px", flex: 1, maxWidth: 120 }}><div style={{ fontSize: 28, fontWeight: 900, color: "#58CC02" }}>{finalCorrect}</div><div style={{ fontSize: 12, color: "#6b7a99" }}>Correct</div></div>
          <div style={{ background: "#1a2535", borderRadius: 16, padding: "20px 24px", flex: 1, maxWidth: 120 }}><div style={{ fontSize: 28, fontWeight: 900, color: "#FF9F00" }}>+{xpEarned}</div><div style={{ fontSize: 12, color: "#6b7a99" }}>XP Earned</div></div>
          <div style={{ background: "#1a2535", borderRadius: 16, padding: "20px 24px", flex: 1, maxWidth: 120 }}><div style={{ fontSize: 28, fontWeight: 900, color: "#FF4B4B" }}>{questions.length - finalCorrect}</div><div style={{ fontSize: 12, color: "#6b7a99" }}>Missed</div></div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%" }}>
          {passed ? (
            <button onClick={() => setScreen("home")} style={{ padding: 16, borderRadius: 16, border: "none", background: "linear-gradient(135deg,#58CC02,#89E219)", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>Back to Lessons 🏠</button>
          ) : (
            <button onClick={() => startLesson(currentLesson, mode)} style={{ padding: 16, borderRadius: 16, border: "none", background: `linear-gradient(135deg, ${currentLesson.color}, ${currentLesson.color}aa)`, color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>Try Again 🔄</button>
          )}
          <button onClick={() => setScreen("home")} style={{ padding: 14, borderRadius: 16, border: "2px solid #1e2d40", background: "transparent", color: "#6b7a99", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>{passed ? "Next Lesson →" : "Back to Home"}</button>
        </div>
      </div>
    );
  }

  /* ============================ TEST RESULT ============================ */
  if (screen === "testresult") {
    const totalCorrect = testResults.filter(r => r.correct).length;
    const passed = totalCorrect >= 6;
    const xpBonus = passed ? 50 : 20;
    return (
      <div style={{ ...S.app, padding: "0 0 60px" }}>
        <div style={{ background: passed ? "linear-gradient(135deg,#1a3a1a,#0f2a0f)" : "linear-gradient(135deg,#3a1a1a,#2a0f0f)", padding: "36px 24px 28px", textAlign: "center", borderBottom: `3px solid ${passed ? "#58CC02" : "#FF4B4B"}44` }}>
          <div style={{ fontSize: 64, marginBottom: 12 }}>{passed ? "🎉" : "💪"}</div>
          <h2 style={{ fontSize: 28, fontWeight: 900, margin: "0 0 6px", color: passed ? "#58CC02" : "#FF4B4B" }}>{passed ? "YOU PASSED!" : "NOT QUITE YET"}</h2>
          <p style={{ color: "#6b7a99", fontSize: 14, marginBottom: 20 }}>{passed ? "Great job! You would pass the real USCIS civics test." : `You need 6/10 to pass. You got ${totalCorrect}/10.`}</p>
          <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 100, height: 100, borderRadius: "50%", border: `5px solid ${passed ? "#58CC02" : "#FF4B4B"}`, background: passed ? "#58CC0218" : "#FF4B4B18", marginBottom: 20 }}>
            <div><div style={{ fontSize: 32, fontWeight: 900, color: passed ? "#58CC02" : "#FF4B4B" }}>{totalCorrect}</div><div style={{ fontSize: 13, color: "#6b7a99" }}>/ 10</div></div>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
            <div style={{ background: "#58CC0222", borderRadius: 12, padding: "10px 16px" }}><div style={{ fontSize: 20, fontWeight: 900, color: "#58CC02" }}>{totalCorrect}</div><div style={{ fontSize: 11, color: "#6b7a99" }}>Correct</div></div>
            <div style={{ background: "#FF4B4B22", borderRadius: 12, padding: "10px 16px" }}><div style={{ fontSize: 20, fontWeight: 900, color: "#FF4B4B" }}>{10-totalCorrect}</div><div style={{ fontSize: 11, color: "#6b7a99" }}>Missed</div></div>
            <div style={{ background: "#FF9F0022", borderRadius: 12, padding: "10px 16px" }}><div style={{ fontSize: 20, fontWeight: 900, color: "#FF9F00" }}>+{xpBonus}</div><div style={{ fontSize: 11, color: "#6b7a99" }}>XP Bonus</div></div>
          </div>
        </div>
        <div style={{ padding: "20px 16px 0" }}>
          <p style={{ fontSize: 13, fontWeight: 800, color: "#6b7a99", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 12 }}>📋 Question Review</p>
          {testResults.map((r, i) => {
            const isOfficial = OFFICIAL_IDS.includes(r.q.id);
            return (
              <div key={i} style={{ background: r.correct ? "#1a3a1a" : "#2a1a1a", border: `1px solid ${r.correct ? "#58CC0244" : "#FF4B4B44"}`, borderRadius: 14, padding: "14px 16px", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                  <span style={{ fontSize: 18, flexShrink: 0 }}>{r.correct ? "✅" : "❌"}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                      <span style={{ fontSize: 11, color: "#6b7a99" }}>Q{typeof r.q.id === "number" ? r.q.id : "custom"}</span>
                      {isOfficial && (<span style={{ fontSize: 10, fontWeight: 700, color: "#FF9F00", background: "#FF9F0022", padding: "1px 6px", borderRadius: 6 }}>⭐ OFFICIAL</span>)}
                    </div>
                    <p style={{ fontSize: 13, fontWeight: 700, color: "#c8d6f0", margin: "0 0 6px", lineHeight: 1.4 }}>{r.q.q}</p>
                    {!r.correct ? (<div><p style={{ fontSize: 12, color: "#FF4B4B", margin: "0 0 3px" }}>Your answer: <span style={{ fontStyle: "italic" }}>{r.userAnswer || "—"}</span></p><p style={{ fontSize: 12, color: "#58CC02", margin: 0 }}>Correct: <strong>{effAnswer(r.q)}</strong></p></div>) : (<p style={{ fontSize: 12, color: "#58CC02", margin: 0 }}>✓ {effAnswer(r.q)}</p>)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ padding: "20px 16px 0", display: "flex", flexDirection: "column", gap: 10 }}>
          {[["🔤","multiple","#58CC02","Choice"],["✍️","writing","#CE82FF","Writing"],["🧠","learn","#FF9F00","Learn"]].map(([icon,tm,color,label]) => (
            <button key={tm} onClick={() => startFullTest(tm)} style={{ padding: 13, borderRadius: 14, background: `${color}22`, color, fontSize: 13, fontWeight: 800, cursor: "pointer", border: `1.5px solid ${color}44` }}>{icon} New Test — {label} Mode</button>
          ))}
          <button onClick={() => setScreen("home")} style={{ padding: 13, borderRadius: 14, border: "2px solid #1e2d40", background: "transparent", color: "#6b7a99", fontSize: 14, cursor: "pointer" }}>← Back to Home</button>
        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

<script>
  (function () {
    try {
      var code = document.getElementById("app-source").textContent;
      var output = Babel.transform(code, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
      }).code;
      var script = document.createElement("script");
      script.text = output;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div style="padding:24px;color:#FF4B4B;font-family:sans-serif;font-size:13px;white-space:pre-wrap;">' +
        'Failed to load app:\n\n' + (err && err.message ? err.message : String(err)) +
        '</div>';
      console.error("App load error:", err);
    }
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
